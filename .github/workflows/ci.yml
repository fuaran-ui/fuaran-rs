# Build, test and wire-format conformance gate for the Rust host.
#
# ── Layout ───────────────────────────────────────────────────────────────────
# The conformance corpus is its own public repository. The test suite locates it
# by walking up from CARGO_MANIFEST_DIR looking for
# `wire-format-fixtures/manifest.json`, so this repo is checked out into a
# subdirectory and the corpus beside it:
#
#     $GITHUB_WORKSPACE/
#     ├── fuaran-rs/               ← this repo
#     └── wire-format-fixtures/    ← the corpus (fuaran-ui/fuaran-ui-specification)
#
# The corpus repository is PUBLIC, so the checkout is anonymous — no token.
#
# ── Why the corpus assertion below is not optional ───────────────────────────
# find_corpus() returns None when the corpus is absent and each conformance test
# then returns early with a "skipping (standalone checkout)" note — it does not
# fail. A layout drift would therefore silently retire the entire conformance
# leg and report green. The assertion turns that into a hard stop.
#
# ── Toolchain ────────────────────────────────────────────────────────────────
# rustup is preinstalled on the runner, so the toolchain is installed directly
# rather than through a third-party action. The usual action for this is
# referenced by a moving branch name rather than a released version, and this
# repo parses untrusted input — an unpinned third-party action in its gate is
# the wrong trade.
#
# ── Reporting ────────────────────────────────────────────────────────────────
# Do NOT set `CARGO_TERM_COLOR: always`, and pass `--color never` to any step
# that greps cargo's output. Colour embeds ANSI escapes ahead of every
# `test result:` line, which silently defeated an anchored grep here once — the
# summary came out EMPTY on its first run while the job stayed green. A
# reporting step that cannot fail is exactly the kind that goes unnoticed when
# it stops reporting.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuaran-rs
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-rs

      # Deliberately UNPINNED: the corpus is the shared conformance authority
      # every host certifies against, and one current spec for all hosts is the
      # point of giving it a single home. Pinning here would let this host drift
      # from the spec without anything going red.
      - name: Check out the wire-format conformance corpus
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures

      - name: Assert the corpus is where the tests resolve it
        run: test -f ../wire-format-fixtures/manifest.json

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version && cargo --version

      - name: Format check (rustfmt)
        run: cargo fmt --all --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      # Print what this gate does NOT assert, on every run. A cap nobody can see
      # reads as "covered everything".
      #
      # These legs resolve an artefact this workflow deliberately does not check
      # out, so each returns early and asserts NOTHING here. They are NOT-RUN,
      # not failing — an env-gated posture, not a quarantine. Both omissions are
      # deliberate: this workflow runs THIS host's own suite, and this host takes
      # no dependency on a sibling. Cross-host parity is covered by the
      # cross-implementation gate that a push here dispatches, and the driver
      # scenario corpus is a separate artefact this repository does not vendor.
      #
      # Keep this list in step with the early-return sites in `tests/` — the
      # whole value of a disclosure is that it is complete.
      - name: Report what this gate does not assert
        run: |
          {
            echo "### Legs that assert nothing in CI (NOT RUN, not failing)"
            echo
            echo "No reference-host checkout — \`reference_host_root()\` finds nothing:"
            echo "  - \`emitted_class_vocabulary_matches_the_reference_renderer\` (tests/render.rs)"
            echo "  - \`form_control_class_vocabulary_matches_the_reference_renderer\` (tests/render.rs)"
            echo "  - \`reference_css_byte_copy_matches_the_reference_artefact\` (tests/render.rs)"
            echo "    These three run, and pass, wherever the reference host sits beside this repo."
            echo
            echo "No driver scenario corpus — neither \`FUARAN_PROGRAM_SPEC\` nor a checkout beside this repo:"
            echo "  - \`the_loop_reproduces_every_scenario_the_corpus_enumerates\` (tests/driver_semantics.rs)"
            echo "  - \`a_mutated_trace_makes_this_harness_go_red\` (tests/driver_semantics.rs)"
            echo "    Operator-invoked (\`run.ps1 -DriverSemantics\`). A corpus that is CLAIMED and"
            echo "    unreadable FAILS this pair rather than skipping it — only an unclaimed one is NOT RUN."
            echo
            echo "Everything else in the suite is gated below, with no exclusions."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # THE GATE — the whole suite, no exclusions. --no-fail-fast so one failing
      # binary does not hide the state of the rest.
      #
      # There is deliberately no skip list here. A failure is a regression: fix
      # it, or revert. Excluding a test to make a red build green retires the
      # coverage silently, and a gate nobody trusts to be complete is not a gate.
      - name: Test (gated)
        run: cargo test --no-fail-fast
