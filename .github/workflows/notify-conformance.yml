name: Notify cross-host conformance gate

# This repo is one of the conformant hosts of the Fuaran UI wire format, so a
# push HERE is precisely the change the cross-implementation conformance gate
# exists to check — yet until this workflow landed, a host push fired NOTHING at
# that gate. `ci.yml` runs this host's own suite; nothing told the cross-host
# gate that a host had moved, and the gate's own push filter cannot see pushes
# to another repo. So it had to be dispatched by hand and the nightly schedule
# was the only backstop. That is the "a quiet run history is not evidence of no
# drift" caveat, on the host side.
#
# The corpus repo already solved this for its own pushes; this is a mirror of
# its workflow, differing only in `source_repo`.
#
# Requires the org-level Actions secret FUARAN_WORKSPACE_APP_PRIVATE_KEY — the
# private key of the `fuaran-ui-workspace-broker` GitHub App (app id 4797739),
# installed on the dispatch target only. The workflow mints a SHORT-LIVED
# installation token at run time (the App holds `Contents: write` there — the
# scope the repository_dispatch REST endpoint requires); no long-lived token is
# stored anywhere. The default GITHUB_TOKEN is scoped to THIS repo only and
# cannot dispatch cross-repo.
#
# NOTE: an unfired trigger looks identical to a green one. If this ever needs
# proving, push a trivial commit and confirm a gate run appears.

on:
  push:
    branches: [main]

# Least privilege, stated rather than inherited. The cross-repo dispatch runs on
# a SHORT-LIVED App installation token, never on the job's own token.
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a workspace App installation token
        id: workspace-token
        # SHA-PINNED, not tag-pinned: this step receives the App private key and
        # mints a write-scoped token on another repository, so a moved `v2` is
        # credential-bearing code nobody reviewed. `# v2.2.2` names the release.
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: 4797739 # fuaran-ui-workspace-broker
          private-key: ${{ secrets.FUARAN_WORKSPACE_APP_PRIVATE_KEY }}
          owner: fuaran-ui
          repositories: workspace

      - name: Trigger cross-host wire-format conformance gate
        env:
          GH_TOKEN: ${{ steps.workspace-token.outputs.token }}
        run: |
          gh api repos/fuaran-ui/workspace/dispatches \
            --method POST \
            -f event_type=wire-conformance \
            -f 'client_payload[source_repo]=fuaran-rs' \
            -f 'client_payload[sha]=${{ github.sha }}'
