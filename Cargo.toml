[package]
name = "fuaran-rs"
version = "0.0.1-alpha"
edition = "2024"
rust-version = "1.85"
description = "Rust host of the Fuaran UI wire format — a dependency-light, idiomatic-Rust reference implementation of the canonical-JSON contract a Rust service, WASM client, or embedded host reads, writes, and drives."
license = "Apache-2.0"
authors = ["Andrew J. Willshire <andrew@diametrical.co.uk>"]
repository = "https://github.com/fuaran-ui/fuaran-rs"
# Stage-0 bootstrap: not a published crate yet.
publish = false

[lib]
name = "fuaran_rs"
path = "src/lib.rs"
# `lib` (rlib) for native consumers + tests; `cdylib` for the `wasm32` client
# module (`cargo build --target wasm32-unknown-unknown --release` → a `.wasm`
# the thin JS loader instantiates) and native dynamic consumers; `staticlib`
# (Phase 537) for the native C-ABI surface the Swift XCFramework and Kotlin
# cargo-ndk `.so` packaging tiers link (`libfuaran_rs.a` / `.lib`). All three
# coexist — native tests use the rlib, and the `src/ffi/` C-ABI symbols are
# emitted into the cdylib + staticlib on every target.
crate-type = ["lib", "cdylib", "staticlib"]

# A small, deterministic `wasm32` artefact: optimise for size, abort on panic
# (no unwinding tables in the browser module), strip debug symbols.
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[dependencies]
# The runtime host uses the Rust standard library only — no third-party crates.
# Rust's stdlib has no JSON, so the canonical JSON layer is hand-written for
# byte-exact output regardless (the same "hand-write the hard part" stance every
# host takes). Third-party crates appear only as dev tooling if ever.
